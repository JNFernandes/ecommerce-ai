# Security automation for ecommerce-ai:
#   secrets       gitleaks over the full git history, failing on any finding
#   dependencies  pip-audit over every locked package (runtime and dev), failing on any finding
#   codeql        CodeQL for the Python code and the GitHub Actions workflows
#   image         Trivy on the image built from the Dockerfile: SARIF to the Security tab, and the
#                 job fails on fixable HIGH/CRITICAL findings
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.30.1
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --verbose --exit-code 1

  dependencies:
    name: Dependencies (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.21"
      - name: Export the lockfile (hashed requirements)
        run: >-
          uv export --locked --all-groups --no-emit-project --format requirements-txt
          -o "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit 2.10.1
        run: >-
          uvx --from pip-audit==2.10.1 pip-audit --strict --disable-pip --require-hashes
          -r "$RUNNER_TEMP/requirements.txt"

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  image:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t ecommerce-ai:scan .
      # 1. Report: SARIF for the Security tab. Never fails, so the upload always happens.
      - name: Trivy (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ecommerce-ai:scan
          scanners: vuln
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          hide-progress: true
          exit-code: "0"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy-image
      # 2. Gate: same scan as a readable table in the log; fails on fixable HIGH/CRITICAL.
      - name: Trivy (gate, fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          skip-setup-trivy: true
          image-ref: ecommerce-ai:scan
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          hide-progress: true
          exit-code: "1"
