# Continuous delivery: publishes the service image to GitHub Container Registry.
#   push to main   ghcr.io/<owner>/ecommerce-ai:main and :sha-<short>
#   tag vX.Y.Z     ghcr.io/<owner>/ecommerce-ai:X.Y.Z, :X.Y and :latest
# An image is published only after the quality gate (ci.yml, reused) passes and Trivy finds no
# fixable HIGH/CRITICAL vulnerability in it. It carries SLSA provenance and an SBOM. A release tag
# must match the version in pyproject.toml.
name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

# Never cancel a publish half-way; runs for the same ref queue instead.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Quality gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"; exit 1; }

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # 1. Build into the local Docker daemon (no push) so the exact image can be scanned first.
      - name: Build (for the scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ecommerce-ai:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (gate, fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ecommerce-ai:scan
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          hide-progress: true
          exit-code: "1"

      # 2. Push the same build (served from the cache) with provenance and an SBOM.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
