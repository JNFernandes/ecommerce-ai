# Quality gate for ecommerce-ai, the same four checks as CLAUDE.md "Quality gate", in order:
# ruff check, ruff format --check, mypy (strict), pytest with the 80% coverage gate.
# actionlint validates the workflows themselves.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # cd.yml runs this same gate before it publishes an image.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.21"
          enable-cache: true
      - name: Install (locked)
        id: install
        run: uv sync --locked
      # Every check runs even when an earlier one failed, so one run reports all problems. Each
      # failure prints the command that fixes it locally (the gate stays blocking: constitution XI).
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          uv run ruff check --output-format=github
          || { echo "::error::Lint failed. Run 'uv run ruff check --fix', fix the rest by hand, commit."; exit 1; }
      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          uv run ruff format --diff
          || { echo "::error::Formatting differs (diff above). Run 'uv run ruff format' and commit."; exit 1; }
      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run mypy
      - name: Tests and coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pytest --cov

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
